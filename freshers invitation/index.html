<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Freshers Registration</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4ff;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        /* HEADER */

        .header {
            height: 220px;

            background:
                linear-gradient(
                    rgba(80,30,150,0.45),
                    rgba(20,80,180,0.55)
                ),
                url("https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=1000&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            color: white;
        }

        .header-content {
            padding: 20px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;

            text-shadow:
                2px 2px 8px rgba(0,0,0,0.5);
        }

        .header p {
            font-size: 16px;

            text-shadow:
                1px 1px 5px rgba(0,0,0,0.5);
        }

        /* FORM */

        .form-area {
            padding: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-weight: bold;
            color: #333;
            font-size: 15px;
        }

        .required {
            color: red;
        }

        input,
        select {
            width: 100%;
            padding: 13px;

            border: 1px solid #d3d7e3;
            border-radius: 9px;

            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #4b35c8;

            box-shadow:
                0 0 5px rgba(75,53,200,0.15);
        }

        /* TALENT CHECKBOXES */

        .talent-box {
            border: 1px solid #d3d7e3;
            border-radius: 10px;
            padding: 12px;
            background: white;
        }

        .talent-option {
            display: flex;
            align-items: center;

            margin-bottom: 10px;

            font-weight: normal;
            cursor: pointer;
        }

        .talent-option:last-child {
            margin-bottom: 0;
        }

        .talent-option input {
            width: auto;
            margin-right: 10px;
            cursor: pointer;
        }

        /* BUTTON */

        .submit-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #4b35c8,
                    #8a35d8
                );

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
        }

        /* SUCCESS */

        .success-message {
            display: none;

            text-align: center;

            margin-top: 20px;

            padding: 15px;

            background: #e8f8ed;

            color: #20743a;

            border-radius: 10px;

            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            body {
                padding: 10px;
            }

            .header {
                height: 200px;
            }

            .header h1 {
                font-size: 26px;
            }

            .header p {
                font-size: 14px;
            }

            .form-area {
                padding: 22px;
            }

        }

    </style>

</head>


<body>


    <div class="form-container">


        <!-- HEADER -->

        <div class="header">

            <div class="header-content">

                <h1>
                    🎉 Freshers Registration
                </h1>

                <p>
                    Welcome Freshers! ✨
                    <br>
                    Register now and be part of the celebration.
                </p>

            </div>

        </div>


        <!-- FORM -->

        <div class="form-area">

            <form id="fresherForm">


                <!-- 1. FULL NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- 2. MOBILE -->

                <div class="form-group">

                    <label>
                        Mobile Number
                        <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter 10-digit mobile number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- 3. ROLL NUMBER -->

                <div class="form-group">

                    <label>
                        Roll Number / Registration Number
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="roll"
                        placeholder="Enter your roll number"
                        required
                    >

                </div>


                <!-- 4. EMAIL -->

                <div class="form-group">

                    <label>
                        Email ID
                        <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- 5. DEPARTMENT -->

                <div class="form-group">

                    <label>
                        Department
                        <span class="required">*</span>
                    </label>

                    <select id="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="CAI">
                            CAI
                        </option>

                        <option value="AIML">
                            AIML
                        </option>

                        <option value="CSDS">
                            CSDS
                        </option>

                    </select>

                </div>


                <!-- 6. SECTION -->

                <div class="form-group">

                    <label>
                        Section
                        <span class="required">*</span>
                    </label>

                    <select id="section" required>

                        <option value="">
                            Select Section
                        </option>

                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>

                    </select>

                </div>


                <!-- 7. ACTIVITIES -->

                <div class="form-group">

                    <label>
                        Interested in Freshers Activities?
                        <span class="required">*</span>
                    </label>

                    <select id="interested" required>

                        <option value="">
                            Select an option
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <!-- 8. TALENT -->

                <div class="form-group">

                    <label>
                        Talent / Special Interest
                        <span class="required">*</span>
                    </label>

                    <div class="talent-box">

                        <label class="talent-option">
                            <input
                                type="checkbox"
                                name="talent"
                                value="Dancing"
                            >
                            Dancing
                        </label>


                        <label class="talent-option">
                            <input
                                type="checkbox"
                                name="talent"
                                value="Singing"
                            >
                            Singing
                        </label>


                        <label class="talent-option">
                            <input
                                type="checkbox"
                                name="talent"
                                value="Drawing"
                            >
                            Drawing
                        </label>


                        <label class="talent-option">
                            <input
                                type="checkbox"
                                name="talent"
                                value="Photography"
                            >
                            Photography
                        </label>


                        <label class="talent-option">
                            <input
                                type="checkbox"
                                name="talent"
                                value="Acting"
                            >
                            Acting
                        </label>


                        <label class="talent-option">
                            <input
                                type="checkbox"
                                name="talent"
                                value="Anchoring"
                            >
                            Anchoring
                        </label>


                        <label class="talent-option">
                            <input
                                type="checkbox"
                                name="talent"
                                value="Sports"
                            >
                            Sports
                        </label>


                        <label class="talent-option">
                            <input
                                type="checkbox"
                                name="talent"
                                value="Coding"
                            >
                            Coding
                        </label>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit-btn">

                    Submit Registration

                </button>


            </form>


            <!-- SUCCESS -->

            <div
                class="success-message"
                id="successMessage">

                🎉 Registration Submitted Successfully!

            </div>


        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        const GOOGLE_SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbyZtAuQ3VbRpOIPPls136p9-d1amuTeKnt51tZbI81RuIOlnsZmddk79qcbPbtVZQk/exec";


        document
            .getElementById("fresherForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                /* MOBILE VALIDATION */

                const mobile =
                    document
                    .getElementById("mobile")
                    .value;


                if (!/^[0-9]{10}$/.test(mobile)) {

                    alert(
                        "Please enter a valid 10-digit mobile number."
                    );

                    return;

                }


                /* GET SELECTED TALENTS */

                const selectedTalents =
                    Array.from(
                        document.querySelectorAll(
                            'input[name="talent"]:checked'
                        )
                    )
                    .map(function(checkbox) {
                        return checkbox.value;
                    });


                /* TALENT VALIDATION */

                if (selectedTalents.length === 0) {

                    alert(
                        "Please select at least one talent."
                    );

                    return;

                }


                /* FORM DATA */

                const formData =
                    new FormData();


                formData.append(
                    "name",
                    document.getElementById("name").value
                );


                formData.append(
                    "mobile",
                    document.getElementById("mobile").value
                );


                formData.append(
                    "roll",
                    document.getElementById("roll").value
                );


                formData.append(
                    "email",
                    document.getElementById("email").value
                );


                formData.append(
                    "department",
                    document.getElementById("department").value
                );


                formData.append(
                    "section",
                    document.getElementById("section").value
                );


                formData.append(
                    "interested",
                    document.getElementById("interested").value
                );


                /* MULTIPLE TALENTS */

                formData.append(
                    "talent",
                    selectedTalents.join(", ")
                );


                /* CREATE HIDDEN FORM */

                const hiddenForm =
                    document.createElement("form");


                hiddenForm.method = "POST";

                hiddenForm.action =
                    GOOGLE_SCRIPT_URL;

                hiddenForm.target =
                    "hiddenFrame";

                hiddenForm.style.display =
                    "none";


                /* ADD DATA */

                for (
                    const [key, value]
                    of formData.entries()
                ) {

                    const input =
                        document.createElement("input");


                    input.type = "hidden";

                    input.name = key;

                    input.value = value;


                    hiddenForm.appendChild(input);

                }


                /* HIDDEN IFRAME */

                const iframe =
                    document.createElement("iframe");


                iframe.name =
                    "hiddenFrame";

                iframe.style.display =
                    "none";


                document.body.appendChild(iframe);

                document.body.appendChild(hiddenForm);


                /* SEND DATA */

                hiddenForm.submit();


                /* SUCCESS */

                setTimeout(function() {

                    document
                        .getElementById("fresherForm")
                        .style.display = "none";


                    document
                        .getElementById("successMessage")
                        .style.display = "block";

                }, 1000);

            });

    </script>


</body>

</html>
